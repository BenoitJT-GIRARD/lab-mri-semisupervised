name: CI

# No `schedule` trigger. Nothing in this repository changes on its own.
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Python
        run: uv python install 3.12

      # pyproject.toml pins the CPU index for torch, so this pulls the +cpu wheels.
      # Nothing on this runner has a GPU, and the CUDA build weighs three gigabytes.
      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      # Read-only steps: the tree that is verified is the tree that was pushed.
      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit
        run: uv run python -m bandit -c pyproject.toml -r src

      # The suite runs on synthetic fixtures and tmp_path only: it never reads
      # data/, so it does not need the MRI images that are not in the repository.
      - name: Pytest
        run: uv run python -m pytest
