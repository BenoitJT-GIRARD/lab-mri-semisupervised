# Pre-commit config — runs lint, format and hygiene checks before every commit.
# Install with: `uv run pre-commit install` (the hooks register in .git/hooks).
# Run by hand with: `uv run pre-commit run --all-files`.

minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(notebooks/.*\.ipynb|reports/.*)$
      - id: end-of-file-fixer
        exclude: ^(notebooks/.*\.ipynb|reports/.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(.*\.bat|.*\.cmd|.*\.ps1)$
      - id: detect-private-key

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [--configfile, pyproject.toml, --quiet]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/.*\.py$
