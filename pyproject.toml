[project]
name = "curelyticsia"
version = "0.1.0"
description = "BrainScanAI — exploration, clustering and semi-supervised learning on brain MRI for tumor detection."
authors = [{ name = "Ben Bijeyti", email = "bijeytis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["medical-imaging", "semi-supervised", "clustering", "computer-vision"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "umap-learn>=0.5.6",
    "tqdm>=4.66",
    "torch>=2.3",
    "torchvision>=0.18",
    "joblib>=1.4",
    "scipy>=1.13",
    "kaleido==0.2.1",
    "python-pptx>=0.6.23",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curelyticsia"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports", "infos", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplifications
    "PL",            # pylint subset
    "RUF",           # ruff-native rules
    "N",             # pep8-naming
]
ignore = [
    "PLR0913",  # too many arguments — common in DL/training APIs
    "PLR2004",  # magic numbers — frequent in image dims, hyperparams
    "E501",     # long lines (handled by formatter when possible)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/curelyticsia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "data", "infos", "reports", ".venv"]
skips = ["B101"]  # assert_used — pytest convention
