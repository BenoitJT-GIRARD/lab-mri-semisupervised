[project]
name = "mri_semisupervised"
version = "0.1.0"
description = "Leak-free protocol for semi-supervised learning on brain MRI, with a negative control."
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["medical-imaging", "semi-supervised", "clustering", "computer-vision"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5.6",
    "tqdm>=4.66",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_semisupervised"]

# --- PyTorch builds: CUDA on the training machine, CPU everywhere else ---
#
# The experiments train on an NVIDIA GPU under Windows, so torch and torchvision come
# from the CUDA 12.6 index there; the +cpu wheels would leave the card idle. The Linux
# resolution is what CI installs, and it has no GPU: pointing it at the CUDA index would
# download about three gigabytes of NVIDIA runtime to run a test suite on CPU.
#
# The marker is the platform, not the presence of a card — uv resolves the lock file
# ahead of time and cannot probe the hardware. On a Linux box with a GPU, swap the two
# indexes below.

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports", "infos", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplifications
    "PL",            # pylint subset
    "RUF",           # ruff-native rules
    "N",             # pep8-naming
]
ignore = [
    "PLR0913",  # too many arguments — common in DL/training APIs
    "PLR2004",  # magic numbers — frequent in image dims, hyperparams
    "PLR0915",  # too many statements — pipeline functions can be long
    "PLR0912",  # too many branches — clustering selection has many cases
    "E501",     # long lines (handled by formatter when possible)
    "RUF001",   # ambiguous-unicode-character — French text uses these intentionally
    "RUF002",   # ambiguous unicode in docstrings — same reason
    "RUF003",   # ambiguous unicode in comments — same reason
    "PLC0415",  # imports inside functions — used for optional torch / lazy umap
    "PLW2901",  # redefined-loop-name — common PyTorch pattern (batch = batch.to(dev))
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415"]
"scripts/*" = ["T201", "E402"]
"notebooks/**/*.ipynb" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
# Warnings are errors (ADR 0028). Two blanket `ignore::` lines used to hide every
# DeprecationWarning and FutureWarning, ours included. The suite passes with no exemption
# at all: nothing this code or its dependencies emit needed silencing, which is the answer
# a blanket ignore made impossible to see.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/mri_semisupervised"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "data", "infos", "reports", ".venv"]
skips = ["B101"]  # assert_used — pytest convention
