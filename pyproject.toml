[project]
name = "mri_semisupervised"
version = "0.1.0"
description = "Leak-free protocol for semi-supervised learning on brain MRI, with a negative control."
authors = [{ name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["medical-imaging", "semi-supervised", "clustering", "computer-vision"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.optional-dependencies]
# UMAP is one of the two projections `viz.plots.project_2d` offers, and the notebooks use
# t-SNE. Kept out of the runtime dependencies: it drags numba, llvmlite and pynndescent into
# every install for a branch nothing here takes.
umap = [
    "umap-learn>=0.5.6",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_semisupervised"]

# --- PyTorch builds: CUDA on the training machine, CPU everywhere else ---
#
# The experiments train on an NVIDIA GPU under Windows, so torch and torchvision come
# from the CUDA 12.6 index there; the +cpu wheels would leave the card idle. The Linux
# resolution is what CI installs, and it has no GPU: pointing it at the CUDA index would
# download about three gigabytes of NVIDIA runtime to run a test suite on CPU.
#
# The marker is the platform, not the presence of a card — uv resolves the lock file
# ahead of time and cannot probe the hardware. On a Linux box with a GPU, swap the two
# indexes below.

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Anchored at the root: `"data"` alone also excluded `src/mri_semisupervised/data/`, so four
# source modules — the loader and the inventory among them — were never linted.
extend-exclude = ["/data", "/reports", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplifications
    "PL",            # pylint subset
    "RUF",           # ruff-native rules
    "N",             # pep8-naming
]
ignore = [
    "PLR0913",  # too many arguments — common in DL/training APIs
    "PLR2004",  # magic numbers — frequent in image dims, hyperparams
    "PLR0915",  # too many statements — pipeline functions can be long
    "PLR0912",  # too many branches — clustering selection has many cases
    "E501",     # long lines (handled by formatter when possible)
    "PLC0415",  # imports inside functions — used for optional torch / lazy umap
    "PLW2901",  # redefined-loop-name — common PyTorch pattern (batch = batch.to(dev))
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415"]
"scripts/*" = ["T201", "E402"]
"notebooks/**/*.ipynb" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: two real components of the repository wired together, or one against a real external dependency",
    "system: the product started the way the README says to start it, questioned through its public surface",
    "claim: fails when a published number, figure, table or artefact stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors (ADR 0028).
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/mri_semisupervised", "scripts"]
branch = true
data_file = "var/.coverage"
# Vendored copies of portfolio tooling, identical in every repository and tested where they
# are written: counting them here would measure someone else's tests.
omit = ["*/figure_style.py", "scripts/run_notebooks.py"]

[tool.coverage.report]
# The floor is the rate measured the day the three tiers were completed, rounded down. A
# floor below the current rate lets the next commit lose coverage in silence.
fail_under = 66
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
directory = "var/coverage-html"

[tool.bandit]
exclude_dirs = ["./tests", "./data", "./reports", "./.venv"]
skips = ["B101"]  # assert_used — pytest convention
